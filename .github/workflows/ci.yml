name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
      - name: Build, unit tests, lint
        run: ./gradlew --console=plain :thermal-core:test :app:testDebugUnitTest :app:lintDebug :app:assembleDebug
      - name: Screenshot matrix (6 languages + en-XA × light/dark × phone/tablet)
        run: ./gradlew --console=plain :app:recordRoborazziDebug
      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: screenshots
          path: app/build/outputs/roborazzi/*.png
          if-no-files-found: ignore
      - name: Upload lint report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lint-report
          path: app/build/reports/lint-results-debug.html
          if-no-files-found: ignore
      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: thermocamera-debug
          path: app/build/outputs/apk/debug/*.apk
